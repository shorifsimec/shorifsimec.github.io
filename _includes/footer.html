<style>
  /* ── Base ── */
  *,
  *::before,
  *::after {
    font-family: "Courier New", Courier, monospace !important;
    box-sizing: border-box;
  }
  body {
    color: #00cc00 !important;
  }

  /* ── Links ── */
  a,
  a:link,
  a:visited,
  a:active {
    color: #00ff00 !important;
    text-decoration: none !important;
  }
  a:hover {
    color: #ffffff !important;
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
  }

  /* ── Heading hierarchy ── */
  h1,
  .post-title {
    color: #00ff00 !important;
    text-shadow:
      0 0 12px rgba(0, 255, 0, 1),
      0 0 24px rgba(0, 255, 0, 0.4) !important;
  }
  h2 {
    color: #00ee00 !important;
    text-shadow: 0 0 8px rgba(0, 255, 0, 0.8) !important;
    border-bottom: 1px solid #003300;
    padding-bottom: 4px;
  }
  h3 {
    color: #00cc00 !important;
    text-shadow: 0 0 6px rgba(0, 255, 0, 0.5) !important;
  }
  h4,
  h5,
  h6 {
    color: #00aa00 !important;
    text-shadow: none !important;
  }
  .site-title {
    color: #00ff00 !important;
    text-shadow: 0 0 10px rgba(0, 255, 0, 0.9) !important;
  }
  .post-link {
    color: #00ff00 !important;
    text-shadow: 0 0 6px rgba(0, 255, 0, 0.6) !important;
  }

  /* ── Body text ── */
  p,
  li,
  td,
  th,
  blockquote {
    color: #00bb00 !important;
    line-height: 1.8 !important;
  }
  strong,
  b {
    color: #00ff00 !important;
  }
  .post-meta {
    color: #007700 !important;
  }

  /* ── Inline code — no borders ── */
  code,
  p code,
  li code,
  td code,
  h1 code,
  h2 code,
  h3 code,
  .post-content code,
  .page-content code {
    background-color: rgba(0, 60, 0, 0.25) !important;
    border: none !important;
    border-width: 0 !important;
    outline: none !important;
    box-shadow: none !important;
    color: #00ff00 !important;
    padding: 2px 6px !important;
    border-radius: 3px !important;
    font-size: 0.9em !important;
  }

  /* ── Code block container ── */
  .highlighter-rouge,
  div.highlighter-rouge,
  figure.highlight {
    background-color: #0a1a0a !important;
    border: 1px solid #005500 !important;
    border-radius: 4px !important;
    position: relative !important;
    padding-top: 30px !important;
    margin: 16px 0 !important;
  }

  /* Kill white background from Minima/rouge */
  .highlight,
  .highlight pre,
  .highlighter-rouge pre,
  .highlighter-rouge pre.highlight {
    background-color: #0a1a0a !important;
    border: none !important;
    margin: 0 !important;
    padding: 12px 16px !important;
    color: #00ff00 !important;
  }

  /* ── Syntax token colors — all green shades ── */
  /* Kill borders/backgrounds on every span rouge generates */
  .highlight span,
  .highlight span * {
    background-color: transparent !important;
    border: none !important;
    box-shadow: none !important;
  }

  /* Fix copy button */
  .copy-code-btn {
    background-color: #0a1a0a !important;
    border: 1px solid #005500 !important;
    color: #00ff00 !important;
  }
  .copy-code-btn:hover {
    border-color: #00ff00 !important;
    box-shadow: 0 0 5px rgba(0, 255, 0, 0.3) !important;
  }
  .highlight .c,
  .highlight .c1,
  .highlight .cm {
    color: #006600 !important;
  } /* comments - dim */
  .highlight .k,
  .highlight .kd,
  .highlight .kn,
  .highlight .kp,
  .highlight .kr,
  .highlight .kt {
    color: #00ff00 !important;
    font-weight: bold !important;
  } /* keywords - bright */
  .highlight .s,
  .highlight .s1,
  .highlight .s2,
  .highlight .se,
  .highlight .si,
  .highlight .sb {
    color: #00cc00 !important;
  } /* strings */
  .highlight .mi,
  .highlight .mf,
  .highlight .m {
    color: #00ee00 !important;
  } /* numbers */
  .highlight .n,
  .highlight .na,
  .highlight .nb,
  .highlight .nc,
  .highlight .nf,
  .highlight .nn,
  .highlight .nv,
  .highlight .nx {
    color: #00bb00 !important;
  } /* names */
  .highlight .o,
  .highlight .ow,
  .highlight .p {
    color: #00ff00 !important;
  } /* operators */
  .highlight .err {
    color: #ff3333 !important;
    background: transparent !important;
  }

  /* ── Blockquotes ── */
  blockquote {
    border-left: 3px solid #00ff00 !important;
    background-color: rgba(0, 255, 0, 0.05) !important;
    padding: 8px 16px !important;
    margin: 16px 0 !important;
  }

  /* ── Layouts ── */
  .site-header,
  .site-footer {
    background-color: rgba(3, 3, 3, 0.92) !important;
    position: relative;
    z-index: 1;
  }
  .page-content,
  .post-content {
    background-color: rgba(3, 3, 3, 0.88) !important;
    position: relative;
    z-index: 1;
  }
  .wrapper {
    max-width: 800px !important;
    background-color: transparent !important;
  }
  .home,
  .post-list {
    background-color: transparent !important;
  }

  /* ── Post list items ── */
  .post-list li {
    border: 1px solid #003300 !important;
    border-left: 3px solid #00ff00 !important;
    background-color: rgba(0, 20, 0, 0.35) !important;
    padding: 16px 20px !important;
    margin-bottom: 16px !important;
    list-style: none !important;
    border-radius: 4px !important;
    transition:
      border-color 0.2s ease,
      background-color 0.2s ease;
  }
  .post-list li:hover {
    border-color: #005500 !important;
    border-left-color: #00ff00 !important;
    background-color: rgba(0, 30, 0, 0.5) !important;
  }

  hr {
    border-color: #003300 !important;
  }

  /* ── Tables ── */
  table {
    background-color: transparent !important;
    border-collapse: collapse !important;
    width: 100% !important;
  }
  table,
  thead,
  tbody,
  tr {
    background-color: transparent !important;
  }
  th {
    background-color: rgba(0, 40, 0, 0.6) !important;
    color: #00ff00 !important;
    border: 1px solid #003300 !important;
    padding: 8px 12px !important;
  }
  td {
    background-color: rgba(0, 20, 0, 0.4) !important;
    color: #00bb00 !important;
    border: 1px solid #002200 !important;
    padding: 8px 12px !important;
  }
  tr:nth-child(even) td {
    background-color: rgba(0, 30, 0, 0.5) !important;
  }
  td code,
  th code {
    background-color: rgba(0, 60, 0, 0.4) !important;
    border: none !important;
    box-shadow: none !important;
  }
</style>

<script
  defer
  src="https://www.thunderbolt.com/gateway/api/v1/thunderbolt-ui/embed.js"
></script>
