<div class="nav-items" style="display: flex; gap: 20px; align-items: center">
  {%- assign sorted_pages = site.html_pages | sort: "order" -%} {%- for
  hyperpage in sorted_pages -%} {%- if hyperpage.title and hyperpage.nav_exclude
  != true -%}
  <a
    class="nav-item"
    href="{{ hyperpage.url | relative_url }}"
    style="text-decoration: none; font-weight: bold"
  >
    {{ hyperpage.title | escape }}
  </a>
  {%- endif -%} {%- endfor -%}
</div>
